services:
  nginx:
    image: nginx:1.21-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./forum:/var/www/html
    depends_on:
      - web
  web:
    # Builds the base target (no xdebug). The default (last-stage) build adds
    # xdebug via pecl, which hits its own stale-CA problem against
    # pecl.php.net - a separate, still-open issue from the apk fix below.
    # xdebug is only for local debugging, not needed to run the forum.
    build:
      context: .
      target: base
    environment:
      # Guard, not a setting (the PHP app never reads it): this file holds only
      # the services every install shares. The database lives in an engine file
      # (docker-compose.mariadb.yml / .mysql.yml / .external.yml) layered on top
      # of this one through COMPOSE_FILE in .env. With COMPOSE_FILE unset,
      # Compose stops here with this message instead of quietly starting a
      # stack that has no database.
      COMPOSE_FILE: ${COMPOSE_FILE:?Set COMPOSE_FILE and COMPOSE_PATH_SEPARATOR in .env to choose a database engine file (copy .env.example to .env if you have none) - see .env.example}
    volumes:
      - ./docker/overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
      - ./forum:/var/www/html
    # No depends_on: mysql - the mysql service only exists in the mariadb and
    # mysql engine files, and the app already shows its own retry-able error
    # page if the DB isn't reachable yet either way.
  # Full-text search server (Manticore, the maintained Sphinx successor).
  # Optional: the forum only uses it once the Manticore host/port are filled in
  # under Admin > Global Forum Settings; otherwise search falls back to MySQL
  # FULLTEXT. See docs/manticore/manticore_setup.md.
  manticore:
    image: manticoresearch/manticore:6.3.6
    entrypoint: ["/bin/sh", "/woodbees/entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "9306:9306"
    volumes:
      - ./docker/manticore:/woodbees:ro
      - manticore_data:/var/lib/manticore
      # The image also declares /usr/local/lib/manticore (its plugin dir) as
      # a volume. Left unbound, Docker creates a fresh anonymous volume for
      # it on every container recreation and never cleans up the old one -
      # confirmed to accumulate across repeated `down`/`up` cycles. Binding
      # it explicitly, same as the data dir above, stops the leak.
      - manticore_plugins:/usr/local/lib/manticore
    environment:
      MANTICORE_WEBTAG: WOODBEES
      # DB_MODE and MANTICORE_DB_HOST/_PORT/_USER/_PASS/_NAME come from the
      # engine file you picked in .env: the bundled engines point them at the
      # bundled `mysql` service, the external one requires you to supply your
      # own server's details.
    # No depends_on: mysql - entrypoint.sh already polls for the DB itself
    # (up to 5 minutes) before building its initial index, and mysql doesn't
    # exist as a compose service at all with the external engine file.
volumes:
  manticore_data:
  manticore_plugins: