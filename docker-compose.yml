services:
  nginx:
    image: nginx:1.21-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./forum:/var/www/html
    depends_on:
      - web
  web:
    build: .
    volumes:
      - ./docker/overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
      - ./forum:/var/www/html
    depends_on:
      - mysql
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    volumes:
      - mysql84_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: beehiveforum
      MYSQL_USER: beehiveforum
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
  # Full-text search server (Manticore, the maintained Sphinx successor).
  # Optional: the forum only uses it once the Manticore host/port are filled in
  # under Admin > Global Forum Settings; otherwise search falls back to MySQL
  # FULLTEXT. See docs/manticore/manticore_setup.md.
  manticore:
    image: manticoresearch/manticore:6.3.6
    entrypoint: ["/bin/sh", "/woodbees/entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "9306:9306"
    volumes:
      - ./docker/manticore:/woodbees:ro
      - manticore_data:/var/lib/manticore
    environment:
      MANTICORE_WEBTAG: WOODBEES
      MANTICORE_DB_HOST: mysql
      MANTICORE_DB_PORT: "3306"
      MANTICORE_DB_USER: beehiveforum
      MANTICORE_DB_PASS: password
      MANTICORE_DB_NAME: beehiveforum
    depends_on:
      - mysql
volumes:
  mysql84_data:
  manticore_data: