server {
    listen 80;
    index index.php;
    root /var/www/html;
    access_log off;
    error_log off;
    client_max_body_size 100M;

    # The web installer can drop every table of a live forum. It is only
    # served while the forum is not configured yet (no include/config.inc.php)
    # or while include/install.enable exists - create that file to run
    # Upgrade, Reinstall or Reconnect; the installer deletes it when done.
    # The installer enforces the same rule itself. This block must stay
    # above the general PHP location below. (No nested location: rewrite
    # rules like these are not inherited by one.)
    location ~ ^/install(-disabled)?/.*\.php$ {
        set $installer_locked "";
        if (-f $document_root/include/config.inc.php) {
            set $installer_locked "Y";
        }
        if (-f $document_root/include/install.enable) {
            set $installer_locked "";
        }
        if ($installer_locked = "Y") {
            return 403;
        }

        try_files $uri =404;
        include fastcgi_params;
        include fastcgi.conf;
        fastcgi_index index.php;
        fastcgi_pass web:9000;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        include fastcgi.conf;
        fastcgi_index index.php;
        fastcgi_pass web:9000;
    }
}